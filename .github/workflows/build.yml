name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q DarkPlayer.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - run: bash download_fonts.sh && gradle assembleDebug --no-daemon
        working-directory: DarkPlayer
      - uses: actions/upload-artifact@v4
        with:
          name: DarkPlayer-apk
          path: DarkPlayer/app/build/outputs/apk/debug/*.apk
